[project]
name = "busy-beaver"
version = "1.0.0"
description = "Tools for enumerating, deciding and simulating Turing Machines for Busy Beaver search"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gmpy2>=2.2",
    "matplotlib>=3.10.9",
    "mypy>=1.8.0",
    "mypy-protobuf>=3.5.0",
    "protobuf>=6.31",
    "psutil>=7",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
]

[tool.ruff]
exclude = ["*_pb2.py", "*_pb2.pyi"]
indent-width = 2
line-length = 120

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
  "E501", # Line too long
  "E701",
  "N999", # Invalid module name (for Capitalized filenames)
  "UP031", # Percent formatting
]
